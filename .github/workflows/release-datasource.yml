name: Release Datasource

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate as a dry run, for example 9.0.0-alpha.1-Musoq.DataSources.Json
        required: true
        type: string
  push:
    tags:
      - '*.*.*-Musoq.DataSources.*'
      - '*.*.*-*-Musoq.DataSources.*'

permissions:
  contents: read

jobs:
  validate-pack:
    name: Validate and pack
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      is_dry_run: ${{ steps.release.outputs.is_dry_run }}

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-dotnet@v4.3.1
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: release
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:RELEASE_INPUT_TAG
            $isDryRun = 'true'
          }
          else {
            $tag = $env:RELEASE_REF_NAME
            $isDryRun = 'false'
          }

          $validateScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/release/Validate-Release.ps1'
          $summaryJson = & $validateScript -Tag $tag -Json
          $summary = $summaryJson | ConvertFrom-Json

          if (-not $summary.isPrerelease) {
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) {
              throw 'Stable datasource releases must point to a commit contained in origin/main.'
            }
          }

          "release_tag=$($summary.tag)" >> $env:GITHUB_OUTPUT
          "release_version=$($summary.version)" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($summary.isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "is_dry_run=$isDryRun" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Musoq.DataSources.sln --nologo

      - name: Build
        run: dotnet build Musoq.DataSources.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test Musoq.DataSources.sln --configuration Release --no-build --nologo --logger "console;verbosity=minimal"

      - name: Pack release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          ./scripts/release/Pack-Release.ps1 -Tag $env:RELEASE_TAG -OutputPath artifacts/release

      - name: Smoke test release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          ./scripts/release/Test-ReleaseSmoke.ps1 -Tag $env:RELEASE_TAG -ArtifactDirectory artifacts/release

      # actions/upload-artifact@v4.6.2
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: datasource-release-artifacts
          path: artifacts/release/**
          if-no-files-found: error

  publish:
    name: Publish to NuGet and plugin registry
    needs: validate-pack
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: nuget-production
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: plugin-registry
      cancel-in-progress: false

    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      # actions/download-artifact@v4.3.0
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: datasource-release-artifacts
          path: artifacts/release

      - name: Select NuGet credentials
        id: nuget-credentials
        shell: pwsh
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          NUGET_MUSOQ_KEY: ${{ secrets.NUGET_MUSOQ_KEY }}
        run: |
          $useTrustedPublishing = -not [string]::IsNullOrWhiteSpace($env:NUGET_USER)
          $hasApiKey = -not [string]::IsNullOrWhiteSpace($env:NUGET_MUSOQ_KEY)

          if (-not $useTrustedPublishing -and -not $hasApiKey) {
            throw 'Configure NUGET_USER for NuGet Trusted Publishing or NUGET_MUSOQ_KEY for API-key publishing.'
          }

          "use_trusted_publishing=$($useTrustedPublishing.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      # NuGet/login@v1
      - name: NuGet login with Trusted Publishing
        if: steps.nuget-credentials.outputs.use_trusted_publishing == 'true'
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-pack.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_MUSOQ_KEY: ${{ secrets.NUGET_MUSOQ_KEY }}
        run: |
          ./scripts/release/Publish-Release.ps1 `
            -Tag $env:RELEASE_TAG `
            -Repository "${{ github.repository }}" `
            -ArtifactDirectory artifacts/release `
            -OutputMetadataPath published-plugins.json

      - name: Update plugin registry
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Update-PluginRegistry.ps1 `
            -Repository "${{ github.repository }}" `
            -PublishedMetadataPath published-plugins.json
