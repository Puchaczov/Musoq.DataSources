name: Publish

on: [push]

jobs:
  build:
    strategy:
      matrix:
        runs-on: [windows-latest]

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    name: Running tests on ${{ matrix.runs-on }}. 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build & Run tests
      run: dotnet test --configuration Release
    - name: Publish
      if: github.ref == 'refs/heads/main'
      run: |
        $scriptLocationDirectory=(Get-Location).ToString()
        $scriptLocationFilePath=[System.IO.Path]::Combine($scriptLocationDirectory, "Publish.Nuget.ps1")
        $projects = Get-ChildItem -Recurse -Filter 'Musoq.DataSources.*.csproj' |
          Where-Object {
            [xml]$csproj = Get-Content $_.FullName
            ($csproj.Project.PropertyGroup | Where-Object { $_.GeneratePackageOnBuild -eq 'true' }).Count -gt 0
          } |
          ForEach-Object { $_.BaseName } |
          Sort-Object -Unique
        foreach ($project in $projects) {
          pushd
          cd "./$project/bin/Release"
          & $scriptLocationFilePath "" $project '${{ secrets.nuget_musoq_key }}'
          popd
        }
